services:
  - type: web
    name: finshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finshield-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: finshield-db
    databaseName: finshield
    user: finshield
    plan: free
